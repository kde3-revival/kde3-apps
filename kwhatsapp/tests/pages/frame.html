<!DOCTYPE html>
<!-- A frame of another site in the application's page (served on 8081). -->
<html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#fdd">
<button id="top" style="position:absolute;left:0;top:0;width:220px;height:50px">frame: top to about:blank</button>
<button id="geo" style="position:absolute;left:0;top:50px;width:220px;height:50px">frame: geolocation</button>
<script>
function log(t) { fetch('/log?' + encodeURIComponent(t), { cache: 'no-store' }); }
document.getElementById('top').onclick = function() { top.location = 'about:blank'; log('frame sent top to about:blank'); };
document.getElementById('geo').onclick = function() {
  navigator.geolocation.getCurrentPosition(function() { log('frame geolocation GRANTED'); },
                                           function(e) { log('frame geolocation error ' + e.code); });
};
</script></body></html>
