<!DOCTYPE html>

<style>
  body { margin: 0; font: 16px sans-serif; background: #eef; }
  .b { position: absolute; width: 220px; height: 70px; box-sizing: border-box; border: 2px solid #446;

  #drop.over { background: #cfc; }
  #out { position: absolute; left: 1000px; top: 895px; margin: 0; font-size: 11px; height: 40px; overflow: hidden; }
</style></head>
<body>

<!-- notifications 2 seconds later (time to put the window away), with a
     picture: a data: URL, one of the page's origin, one of another site
     (never shown or fetched); two at once (the queue); one the page
     closes 3 seconds after showing it -->
<button class="b" id="nicon" style="left:20px;top:640px">notify data: icon</button>
<button class="b" id="nsame" style="left:260px;top:640px">notify own icon</button>
<button class="b" id="nforeign" style="left:500px;top:640px">notify foreign icon</button>

<!-- the bridge of the notifications' pictures: a picture of known pixels;
     the same after the page replaced what it could (canvas, Image, URL,
     timers, Reflect, JSON, dispatchEvent, ...); announcements flooding a
     waiting notification; 30 at once (the balloon's queue); 106 (the
     part keeps 100); the constructor's arguments read once; text that
     must be cut and isolated -->
<button class="b" id="npixels" style="left:20px;top:740px">notify known pixels</button>
<button class="b" id="ntamper" style="left:260px;top:740px">tampered, known pixels</button>
<button class="b" id="nflood" style="left:500px;top:740px">flood announcements</button>
<button class="b" id="nover" style="left:740px;top:740px">notify 30</button>
<button class="b" id="nevict" style="left:1000px;top:740px">notify 106</button>
<button class="b" id="nprobe" style="left:20px;top:820px">constructor probe</button>
<button class="b" id="nunicode" style="left:260px;top:820px">notify unicode</button>
<button class="b" id="nclone" style="left:500px;top:820px">failed construction</button>

<button class="b" id="nhuge" style="left:740px;top:605px;height:30px;z-index:1">icon, endless</button>
<button class="b" id="nbigburst" style="left:740px;top:490px;height:40px;z-index:1">burst of 86</button>
<button class="b" id="nburst" style="left:740px;top:560px;height:40px;z-index:1">burst</button>
<pre id="out"></pre>
<script>
function log(text) {
  document.getElementById('out').textContent += text + '\n';
  fetch('/log?' + encodeURIComponent(text), { cache: 'no-store' });
}
function idb(done) {
  try {
    var r = indexedDB.open('kwtest', 1);
    r.onupgradeneeded = function() { r.result.createObjectStore('s'); };
    r.onsuccess = function() {
      var tx = r.result.transaction('s', 'readwrite'), s = tx.objectStore('s'), g = s.get('n');
      g.onsuccess = function() { var n = (g.result || 0) + 1; s.put(n, 'n'); done(n); };
    };
    r.onerror = function() { done('error'); };
  } catch (e) { done('exception ' + e); }
}
window.addEventListener('load', function() {
  var visits = (+localStorage.getItem('visits') || 0) + 1;
  localStorage.setItem('visits', visits);
  var cookie = document.cookie;
  document.cookie = 'kwtest=' + visits + '; max-age=31536000; path=/';
  idb(function(n) {
    log('load visit=' + visits + ' cookie=[' + cookie + '] idb=' + n + ' permission=' +
        (window.Notification ? Notification.permission : 'no-api') + ' ua=' + navigator.userAgent);
    if (navigator.permissions)
      navigator.permissions.query({ name: 'notifications' }).then(function(s) { log('query ' + s.state); },
                                                                 function(e) { log('query error ' + e); });
  });
});
document.getElementById('perm').onclick = function() {
  Notification.requestPermission().then(function(p) { log('permission ' + p); });
};
document.getElementById('notify').onclick = function() {
  var n = new Notification('Alice <Test>', { body: 'Hello <b>bold</b> & co\nsecond line', tag: 't1' });
  n.onshow = function() { log('notification shown'); };
  n.onclick = function() { log('notification click'); };
  n.onerror = function() { log('notification error'); };
};
function redSquare() {
  var c = document.createElement('canvas');
  c.width = c.height = 200;
  var g = c.getContext('2d');
  g.fillStyle = '#ff0000'; g.fillRect(0, 0, 200, 200);
  g.fillStyle = '#ffffff'; g.fillRect(70, 70, 60, 60);
  return c.toDataURL('image/png');
}
function later(title, options, then) {
  setTimeout(function() {
    var n = new Notification(title, options);
    n.onshow = function() { log('notification shown ' + options.tag); if (then) then(n); };
    n.onclick = function() { log('notification click ' + options.tag); };
    n.onclose = function() { log('notification closed ' + options.tag); };
  }, 2000);
  log('armed ' + options.tag);
}
document.getElementById('nicon').onclick = function() {
  later('Bob Picture', { body: 'A message with a picture, and a long text the balloon trims at thirty characters',
                         tag: 't2', icon: redSquare() });
};
document.getElementById('nsame').onclick = function() {
  later('Carol <Same>', { body: 'own origin', tag: 't3', icon: '/avatar.svg' });
};
document.getElementById('nforeign').onclick = function() {
  later('Dave Foreign', { body: 'icon of another site', tag: 't4', icon: 'http://127.0.0.1:8081/avatar.svg?foreign' });
};
document.getElementById('ntwo').onclick = function() {
  later('Queue One', { body: 'first', tag: 'q1' });
  later('Queue Two', { body: 'second', tag: 'q2' });
};
document.getElementById('nclose').onclick = function() {
  later('Eve Closes', { body: 'closed by the page', tag: 't5' },
        function(n) { setTimeout(function() { n.close(); log('page closed t5'); }, 3000); });
};
// 40 x 40, opaque, noise (xorshift32, tests/inner.sh makes the same to
// compare): its PNG does not compress, the data: URL is about 8,7k
// characters
function knownPixels() {
  var c = document.createElement('canvas');
  c.width = c.height = 40;
  var g = c.getContext('2d'), d = g.createImageData(40, 40), s = 2463534242;
  for (var i = 0; i < 40 * 40 * 4; i += 4) {
    s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
    d.data[i] = s & 255; d.data[i + 1] = (s >>> 8) & 255; d.data[i + 2] = (s >>> 16) & 255; d.data[i + 3] = 255;
  }
  g.putImageData(d, 0, 0);
  return c.toDataURL('image/png');
}
var pageSetTimeout = window.setTimeout;
document.getElementById('npixels').onclick = function() {
  var icon = knownPixels();
  log('pixels url ' + icon.length);
  later('Pixel Known', { body: 'known pixels', tag: 'px1', icon: icon });
};
document.getElementById('ntamper').onclick = function() {
  var icon = knownPixels(), N = window.Notification;
  // everything a script of the page could replace before it notifies
  var P2 = CanvasRenderingContext2D.prototype, PC = HTMLCanvasElement.prototype;
  P2.drawImage = function() {};
  P2.getImageData = function(x, y, w, h) { return { data: new Uint8ClampedArray(w * h * 4) }; };
  PC.getContext = function() { return null; };
  PC.toDataURL = function() { return 'data:,'; };
  window.Image = function() { return {}; };
  window.URL = function() { throw new Error('no URL'); };
  window.setTimeout = function() { return 0; };
  window.btoa = function() { return ''; };
  Reflect.construct = function() { throw new Error('no construct'); };
  Reflect.apply = function() { throw new Error('no apply'); };
  JSON.stringify = function() { return '"tampered"'; };
  EventTarget.prototype.dispatchEvent = function() { return true; };
  Object.defineProperty = function() { throw new Error('no defineProperty'); };
  Object.create = function() { return {}; };
  window.CustomEvent = function() { return {}; };
  String.fromCharCode = function() { return ''; };
  window.Notification = N;
  log('tampered');
  pageSetTimeout(function() {
    var n = new Notification('Pixel Tampered', { body: 'tampered page', tag: 'px2', icon: icon });
    n.onshow = function() { log('notification shown px2'); };
    n.onclick = function() { log('notification click px2'); };
  }, 2000);
};
// (what it needs kept from before the page tampers with it: the burst
// of 86 comes after that)
var pageDispatch = EventTarget.prototype.dispatchEvent, PageCustomEvent = CustomEvent, pageStringify = JSON.stringify;
function forge(title, body, tag, icon) {
  pageDispatch.call(document, new PageCustomEvent('kwpe-notification', { detail: pageStringify([title, body, tag, icon]) }));
}
document.getElementById('nflood').onclick = function() {
  // announcements matching the notification, 25 every 100 ms for 8
  // seconds, of a picture that comes after 5 seconds
  pageSetTimeout(function() {
    var end = Date.now() + 8000;
    var timer = setInterval(function() {
      for (var i = 0; i < 25; i++) forge('Flood', 'flooded', 'fl', '/slow.svg');
      if (Date.now() > end) { clearInterval(timer); log('flood over'); }
    }, 100);
    pageSetTimeout(function() {
      var n = new Notification('Flood', { body: 'flooded', tag: 'fl', icon: '/slow.svg' });
      n.onshow = function() { log('notification shown fl'); };
      n.onerror = function() { log('notification error fl'); };
      n.onclick = function() { log('notification click fl'); };
      log('created fl');
    }, 500);
  }, 2000);
  log('armed fl');
};
document.getElementById('nover').onclick = function() {
  pageSetTimeout(function() {
    for (var i = 1; i <= 30; i++) new Notification('Over ' + i, { body: 'overflow', tag: 'ov' + i });
    log('notified 30');
  }, 2000);
};
document.getElementById('nevict').onclick = function() {
  pageSetTimeout(function() {
    var first = new Notification('Evict 0', { body: 'evicted', tag: 'ev0' });
    first.onclick = function() { log('notification click ev0'); };
    first.onclose = function() { log('notification closed ev0'); };
    pageSetTimeout(function() {
      for (var i = 1; i <= 105; i++) {
        var n = new Notification('Evict ' + i, { body: 'evicting', tag: 'ev' + i });
        n.onclick = (function(k) { return function() { log('notification click ev' + k); }; })(i);
      }
      log('notified 106');
    }, 2500);
  }, 2000);
};
document.getElementById('nprobe').onclick = function() {
  var reads = { title: 0, body: 0, tag: 0, icon: 0 };
  var title = { toString: function() { reads.title++; return reads.title == 1 ? 'Getter T1' : 'Getter T2'; } };
  var options = {
    get body() { reads.body++; return 'body' + reads.body; },
    get tag() { reads.tag++; return 'probe' + reads.tag; },
    get icon() { reads.icon++; return knownPixels(); }
  };
  var n = new Notification(title, options);
  var handler = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.kwpeNotification;
  log('probe reads title=' + reads.title + ' body=' + reads.body + ' tag=' + reads.tag + ' icon=' + reads.icon +
      ' constructed=' + n.title + '/' + n.body + '/' + n.tag + ' ctor=' + (n.constructor === Notification) +
      ' instanceof=' + (n instanceof Notification) + ' name=' + Notification.name + ' length=' + Notification.length +
      ' permission=' + Notification.permission + ' handler=' + (handler ? 'present' : 'absent'));
  try { Notification('x'); log('probe call without new: no error'); } catch (e) { log('probe call without new: ' + e.name); }
  n.close();
  // members WebKit does not have are not read; an invalid dir stops the
  // reading there
  try {
    new Notification('Probe Actions', { tag: 'pa', get actions() { throw new Error('read'); } }).close();
    log('probe actions ignored');
  } catch (e) { log('probe actions threw ' + e.message); }
  var after = 0;
  try {
    new Notification('Probe Dir', { dir: 'sideways', get icon() { after++; return 'x'; }, get tag() { after++; return 't'; } });
    log('probe dir accepted');
  } catch (e) { log('probe dir ' + e.name + ' later reads=' + after); }
};
document.getElementById('nunicode').onclick = function() {
  // the 30th character an emoji (a surrogate pair at the cut), the
  // sender with a right-to-left override; then a ZWJ family at the
  // sender's cut (40) and a flag (two regional indicators) at the text's
  // (30)
  later('Mallory \u202Eevil\u202C name', { body: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaa\uD83D\uDE00 and more', tag: 'u1' });
  later('Family ' + 'b'.repeat(31) + '\uD83D\uDC68\u200D\uD83D\uDC69\u200D\uD83D\uDC67 x',
        { body: 'a'.repeat(28) + '\uD83C\uDDF7\uD83C\uDDF4 more', tag: 'u2' });
  // an Indic conjunct (क्ष: ka, virama, ssa) at the text's cut
  later('Conjunct', { body: 'a'.repeat(28) + '\u0915\u094D\u0937 more', tag: 'u3' });
};
// two notifications alike (no tag), the first with an icon that takes a
// second (WebKit shows it once loaded: the second comes first): the one
// without an icon never gets the other's picture
// A with an icon that takes 0.4 seconds, 19 other announcements, B alike
// with another icon (blue) that takes 0.9 (both within the bridge's 1.5):
// the burst drops A's announcement (20 kept); A, shown first, must not
// get B's picture (nor B, whose announcement A took, A's).  The same with
// 84 others: more announcements dropped than the part remembers.
// a picture of an origin the application lists (tests: 127.0.0.1:8081)
// that allows CORS; one of an origin not listed (8082); one of the listed
// origin that redirects to the one not listed (both allow CORS)
document.getElementById('ncors').onclick = function() {
  later('Cors Picture', { body: 'listed origin, CORS', tag: 'c1', icon: 'http://127.0.0.1:8081/cors/avatar.svg?secret=1' });
};
document.getElementById('nrefused').onclick = function() {
  later('Unlisted Picture', { body: 'origin not listed', tag: 'c2', icon: 'http://127.0.0.1:8082/avatar.svg?secret=2' });
};
document.getElementById('nredirect').onclick = function() {
  later('Redirected Picture', { body: 'listed origin, redirected', tag: 'c3',
                                icon: 'http://127.0.0.1:8081/cors/redirect?to=' +
                                      encodeURIComponent('http://127.0.0.1:8082/cors/avatar.svg?redirected=1') });
};
// a picture of a listed origin whose body does not end (more than the
// bridge takes): cancelled once past 4 MiB
document.getElementById('nhuge').onclick = function() {
  later('Endless Picture', { body: 'listed origin, endless', tag: 'c4', icon: 'http://127.0.0.1:8081/cors/huge.svg' });
};
function notifyBurst(title, others) {
  var list = [new Notification(title, { body: 'alike', icon: '/delay.svg?ms=400&' + title.length })];
  // (announcements of no notification, as the page may send: none of
  // them is shown and takes its announcement before the cut, all of them
  // dropped, A's first)
  for (var i = 1; i <= others; i++) forge(title + ' filler ' + i, 'burst', 'f' + i, '');
  list.push(new Notification(title, { body: 'alike', icon: '/delay.svg?ms=900&blue&' + title.length }));
  return list;
}
document.getElementById('nburst').onclick = function() {
  window.burst = notifyBurst('Burst', 19);
  log('burst notified');
};
document.getElementById('nbigburst').onclick = function() {
  window.bigBurst = notifyBurst('Big Burst', 84);
  log('big burst notified');
};
document.getElementById('ntwin').onclick = function() {
  pageSetTimeout(function() {
    var a = new Notification('Twin', { body: 'alike', icon: '/delay1.svg' });
    a.onshow = function() { log('twin shown icon'); };
    var b = new Notification('Twin', { body: 'alike' });
    b.onshow = function() { log('twin shown plain'); };
    window.twins = [a, b];
    log('twin notified');
  }, 2000);
};
// a construction that fails (data that cannot be cloned) leaves no
// announcement: the next one with the same title, body and tag (no
// icon) has no picture
document.getElementById('nclone').onclick = function() {
  try {
    new Notification('Clone Same', { body: 'clone', tag: 'dc', icon: redSquare(), data: function() {} });
    log('clone constructed');
  } catch (e) { log('clone ' + e.name); }
  later('Clone Same', { body: 'clone', tag: 'dc' });
};
// two notifications, the first waiting for its picture (5 seconds away),
// then another document of the site (nav.html) announces the second
// one's title, body and tag with a picture: not given to it
document.getElementById('nnav').onclick = function() {
  pageSetTimeout(function() {
    var a = new Notification('Nav Wait', { body: 'waits', tag: 'na', icon: '/slow.svg' });
    var b = new Notification('Nav Same', { body: 'queued', tag: 'nb' });
    log('nav notified');
    location.href = '/nav.html';
  }, 2000);
  log('armed nav');
};
window.addEventListener('load', function() {
  var h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.kwpeNotification;
  log('top kwpe handler ' + (h ? 'present' : 'absent'));
});
document.getElementById('replace').onclick = function() {
  setTimeout(function() { location.replace('http://127.0.0.1:8081/other.html'); }, 1500);
  log('replace armed');
};
document.getElementById('datanav').onclick = function() {
  setTimeout(function() { location.href = 'data:text/html,<title>DATA</title>DATA'; }, 1500);
  log('data armed');
};
document.getElementById('unread').onclick = function() { document.title = '(3) WhatsApp'; log('title ' + document.title); };
document.getElementById('read').onclick = function() { document.title = 'WhatsApp'; log('title ' + document.title); };
document.getElementById('blob').onclick = function() {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['blob content from the page\n'], { type: 'text/plain' }));
  a.download = 'blob.txt';
  document.body.appendChild(a);
  a.click();
  log('blob clicked');
};
document.getElementById('file').onchange = function(e) {
  var f = e.target.files[0];
  f.text().then(function(t) { log('upload ' + f.name + ' ' + f.size + ' ' + JSON.stringify(t.slice(0, 30))); });
};
document.getElementById('mic').onclick = function() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { log('mic no-api'); return; }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function() { log('mic granted'); },
                                                            function(e) { log('mic ' + e.name); });
};
var drop = document.getElementById('drop');
drop.addEventListener('dragenter', function(e) { e.preventDefault(); drop.className = 'over'; log('dragenter'); });
drop.addEventListener('dragover', function(e) { e.preventDefault(); });
drop.addEventListener('drop', function(e) {
  e.preventDefault();
  drop.className = '';
  var files = e.dataTransfer.files;
  log('drop types=' + Array.prototype.join.call(e.dataTransfer.types, ',') + ' files=' + files.length +
      ' trusted=' + e.isTrusted);
  Array.prototype.forEach.call(files, function(f) {
    f.arrayBuffer().then(function(b) {
      var bytes = new Uint8Array(b), sum = 0;
      for (var i = 0; i < bytes.length; i++) sum = (sum * 31 + bytes[i]) >>> 0;
      log('dropped ' + f.name + ' ' + f.size + ' ' + f.type + ' sum=' + sum);
    });
  });
});
</script>
